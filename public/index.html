    const series = state.history.map(h => ({ date: h.date, invested: TOTAL_BUDGET, pnl: h.totalValue - TOTAL_BUDGET }));
    // Anlık günlük fiyatlarla "şimdi" noktasını ekle (resmi geçmişe kaydedilmemiş, sadece görüntü için)
    const stockValNow = TICKERS.reduce((s,t)=>s+state.positions[t]*(state.dailyPrices[t]||state.lastPrices[t]),0);
    const nowTotal = state.cash + stockValNow;

          <div style="display:flex;align-items:center;gap:6px;"><span style="width:14px;height:3px;background:${latestPnl>=0?'#4FCB98':'#E0684F'};display:inline-block;border-radius:2px;"></span><span class="muted" style="font-size:12px;">Kâr / Zarar</span></div>

      btn.onclick = () => { monthlyView = btn.getAttribute('data-view'); renderIstatistik(); };

      btn.onclick = () => { monthlyUnit = btn.getAttribute('data-unit'); renderIstatistik(); };
    });
  }

  function computeMonthlyAggregates(){
    // Her aya ait EN SON kaydı bul (kuruluş + rotasyonlar + anlık "şimdi")
    const monthlyLast = {};
    state.history.forEach(h => {
      const month = h.date.slice(0,7);
      if(!monthlyLast[month] || h.date >= monthlyLast[month].date){
        monthlyLast[month] = {date: h.date, totalValue: h.totalValue, positions: h.positions};
      }
    });
    const today = new Date().toISOString().slice(0,10);
    const nowMonth = today.slice(0,7);
    const stockValNow = TICKERS.reduce((s,t)=>s+state.positions[t]*(state.dailyPrices[t]||state.lastPrices[t]),0);
    const nowTotal = state.cash + stockValNow;
    const nowPositions = Object.fromEntries(TICKERS.map(t=>{
      const price = state.dailyPrices[t]||state.lastPrices[t];
      return [t, {price, qty: state.positions[t], value: state.positions[t]*price}];
    }));
    if(!monthlyLast[nowMonth] || today >= monthlyLast[nowMonth].date){
      monthlyLast[nowMonth] = {date: today, totalValue: nowTotal, positions: nowPositions};
    }
    const months = Object.keys(monthlyLast).sort();
    let prevTotal = TOTAL_BUDGET;
    return months.map(m => {
      const entry = monthlyLast[m];
      const pnlTl = entry.totalValue - prevTotal;
      const pnlPct = prevTotal ? (pnlTl/prevTotal*100) : 0;
      prevTotal = entry.totalValue;
      return { month: m, endValue: entry.totalValue, pnlTl, pnlPct, positions: entry.positions };
    });
  }

  function computeMonthlyPPF(){
    // dailyInterestOnly, SADECE faizden kaynaklanan günlük payı tutar — rotasyonlardaki
    // alım/satım nakit akışları buna hiç karışmaz (önceki sürümde dailyCashSnapshots
    // farkı kullanılıyordu, bu da rotasyon günlerinde ticaret etkisini yanlışlıkla
    // "PPF faizi" olarak sayıyordu — düzeltildi).
    const interestOnly = state.dailyInterestOnly || {};
    const dates = Object.keys(interestOnly).sort();
    const monthlyTl = {}, monthlyBase = {};
    dates.forEach(d => {
      const month = d.slice(0,7);
      const portion = interestOnly[d] || 0;
      monthlyTl[month] = (monthlyTl[month]||0) + portion;
      // Yüzde hesap için baz: o günkü faiz öncesi nakit (yaklaşık — snapshot'tan çıkarılıyor)
      const snap = state.dailyCashSnapshots ? state.dailyCashSnapshots[d] : undefined;
      if(monthlyBase[month] === undefined && snap !== undefined){
        monthlyBase[month] = snap - portion;
      }
    });
    return { monthlyTl, monthlyBase };
  }

  function computeMonthlyPerTicker(){
    // Sadece ay-sonu POZİSYON DEĞERİNİ karşılaştırmak yanıltıcı olur, çünkü bu
    // strateji her hafta pozisyonu ~200.000 ₺ hedefine geri çekiyor — ay içinde
    // kaç kez rotasyon olursa olsun ay sonu değeri hep hedefe yakın kalır.
    // Bunun yerine, her hissenin TOPLAM kâr/zararını (o ana kadarki tüm SATIŞLARDAN
    // gerçekleşen kâr/zarar + halihazırda elde tutulan pozisyonun maliyete göre
    // gerçekleşmemiş kâr/zararı) kuruluştan itibaren tarihsel olarak yeniden kurup,
    // ay sonları arasındaki farkını alıyoruz — gerçek aylık katkıyı verir.
    const qty = {}, costBasis = {}, cumRealized = {};
    TICKERS.forEach(t => {
      const p = state.history[0].positions && state.history[0].positions[t];
      qty[t] = p ? p.qty : 0;
      costBasis[t] = p ? p.price : (state.lastPrices[t]||0);
      cumRealized[t] = 0;
    });

    const monthlySnap = {}; // 'YYYY-MM' -> {date, totalPnl:{ticker:deger}}
    for(let i=1; i<state.history.length; i++){
      const entry = state.history[i];
      (entry.transactions||[]).forEach(tx => {
        if(!tx.ticker || !tx.action || tx.action==='YOK') return;
        const t = tx.ticker;
        if(tx.action === 'AL'){
          const oldQty = qty[t], newQty = oldQty + tx.qty;
          costBasis[t] = newQty>0 ? (oldQty*costBasis[t] + tx.qty*tx.price) / newQty : tx.price;
          qty[t] = newQty;
        } else if(tx.action === 'SAT'){
          cumRealized[t] += (tx.realized !== undefined ? tx.realized : (tx.price-costBasis[t])*tx.qty);
          qty[t] -= tx.qty;
        }
      });
      const month = entry.date.slice(0,7);
      const totalPnl = {};
      TICKERS.forEach(t => {
        const price = entry.positions && entry.positions[t] ? entry.positions[t].price : costBasis[t];
        totalPnl[t] = qty[t]*(price-costBasis[t]) + cumRealized[t];
      });
      if(!monthlySnap[month] || entry.date >= monthlySnap[month].date){
        monthlySnap[month] = { date: entry.date, totalPnl };
      }
    }
    // Anlık "şimdi" noktasını da ekle (güncel fiyatlarla)
    const today = new Date().toISOString().slice(0,10);
    const nowMonth = today.slice(0,7);
    const nowTotalPnl = {};
    TICKERS.forEach(t => {
      const price = state.dailyPrices[t]||state.lastPrices[t];
      const liveCost = state.positionCostBasis && state.positionCostBasis[t] !== undefined ? state.positionCostBasis[t] : costBasis[t];
      const liveQty = state.positions[t] !== undefined ? state.positions[t] : qty[t];
      const liveRealized = state.realizedPnL !== undefined ? cumRealized[t] : cumRealized[t]; // per-ticker realized zaten cumRealized'ta
      nowTotalPnl[t] = liveQty*(price-liveCost) + cumRealized[t];
    });
    if(!monthlySnap[nowMonth] || today >= monthlySnap[nowMonth].date){
      monthlySnap[nowMonth] = { date: today, totalPnl: nowTotalPnl };
    }

    const months = Object.keys(monthlySnap).sort();
    const ppfData = computeMonthlyPPF();
    const prevVal = {}; TICKERS.forEach(t => prevVal[t] = 0); // kuruluşta henüz kâr/zarar yok
    return months.map(m => {
      const perTicker = {};
      TICKERS.forEach(t => {
        const val = monthlySnap[m].totalPnl[t];
        const pnlTl = val - prevVal[t];
        const pnlPct = TARGET_PER_STOCK ? (pnlTl/TARGET_PER_STOCK*100) : 0; // hedef bant (200k) baz alınır
        perTicker[t] = { pnlTl, pnlPct };
        prevVal[t] = val;
      });
      const ppfTl = ppfData.monthlyTl[m] || 0;
      const ppfBase = ppfData.monthlyBase[m];
      const ppfPct = ppfBase ? (ppfTl/ppfBase*100) : 0;
      perTicker['PPF'] = { pnlTl: ppfTl, pnlPct: ppfPct };
      return { month: m, perTicker };
    });
  }

  function renderMonthlyPnlSection(){
    const aggData = computeMonthlyAggregates();
    if(aggData.length === 0) return '';
    return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:4px;">
          <h2 class="section-title" style="font-size:15px;margin:0;">Aylık K/Z</h2>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <div style="display:flex;gap:4px;background:var(--panel-2);border-radius:8px;padding:3px;">
              <button type="button" class="monthly-view-btn" data-view="toplam" style="font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;background:${monthlyView==='toplam'?'var(--brass)':'transparent'};color:${monthlyView==='toplam'?'#062318':'var(--ink-soft)'};">Toplam</button>
              <button type="button" class="monthly-view-btn" data-view="hisse" style="font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;background:${monthlyView==='hisse'?'var(--brass)':'transparent'};color:${monthlyView==='hisse'?'#062318':'var(--ink-soft)'};">Hisse Kırılımlı</button>
            </div>
            <div style="display:flex;gap:4px;background:var(--panel-2);border-radius:8px;padding:3px;">
              <button type="button" class="monthly-unit-btn" data-unit="tl" style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;background:${monthlyUnit==='tl'?'var(--brass)':'transparent'};color:${monthlyUnit==='tl'?'#062318':'var(--ink-soft)'};">₺</button>
              <button type="button" class="monthly-unit-btn" data-unit="yuzde" style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;background:${monthlyUnit==='yuzde'?'var(--brass)':'transparent'};color:${monthlyUnit==='yuzde'?'#062318':'var(--ink-soft)'};">%</button>
            </div>
          </div>
        </div>
        ${monthlyView==='toplam' ? renderMonthlyAggregateChart(aggData, monthlyUnit) : renderMonthlyPerTickerChart(computeMonthlyPerTicker(), monthlyUnit)}
      </div>
    `;
  }

  function monthLabel(m){
    const [y,mo] = m.split('-');
    const isimler = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
    return isimler[parseInt(mo,10)-1] + ' ' + y.slice(2);
  }

  function renderMonthlyAggregateChart(data, unit){
    const w = 640, h = 220, padL=64, padR=15, padT=20, padB=32;
    const plotW = w-padL-padR, plotH = h-padT-padB;
    const vals = data.map(d => unit==='tl' ? d.pnlTl : d.pnlPct);
    let maxV = Math.max(0, ...vals), minV = Math.min(0, ...vals);
    const pad = Math.max((maxV-minV)*0.18, Math.max(Math.abs(maxV),Math.abs(minV))*0.12, unit==='tl'?500:1);
    maxV += pad; minV -= pad;
    const yFor = (v) => padT + plotH - ((v-minV)/((maxV-minV)||1))*plotH;
    const zeroY = yFor(0);
    const barW = Math.min(56, plotW/data.length*0.55);
    const slot = plotW/data.length;

    const bars = data.map((d,i) => {
      const v = unit==='tl' ? d.pnlTl : d.pnlPct;
      const x = padL + slot*i + (slot-barW)/2;
      const y = Math.min(zeroY, yFor(v));
      const barH = Math.max(1, Math.abs(yFor(v)-zeroY));
      const color = v>=0 ? '#4FCB98' : '#E0684F';
      const valText = unit==='tl' ? fmt(v) : (v>=0?'+':'')+v.toFixed(2)+'%';
      return `
        <g class="monthly-bar" data-month="${d.month}" data-tl="${d.pnlTl}" data-pct="${d.pnlPct}" style="cursor:pointer;">
          <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}" rx="3"/>
          <text x="${(x+barW/2).toFixed(1)}" y="${h-padB+16}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#8CA0BC">${monthLabel(d.month)}</text>
        </g>
      `;
    }).join('');

    return `
      <div class="chart-wrap" id="monthly-chart-wrap">
        <svg width="100%" viewBox="0 0 ${w} ${h}" style="max-width:100%;">
          <line x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}" stroke="#294869" stroke-width="1"/>
          <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="#294869" stroke-width="1"/>
          <text x="${padL-6}" y="${zeroY}" text-anchor="end" dominant-baseline="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#8CA0BC">0</text>
          ${bars}
        </svg>
        <div class="chart-tooltip" id="monthly-chart-tooltip"></div>
      </div>
    `;
  }

  function renderMonthlyPerTickerChart(data, unit){
    const PPF_COLOR = '#F1F5FA';
    const CHART_ITEMS = TICKERS.concat(['PPF']);
    const colorFor = (t) => t==='PPF' ? PPF_COLOR : TICKER_COLORS[t];
    const w = 680, h = 240, padL=64, padR=15, padT=20, padB=32;
    const plotW = w-padL-padR, plotH = h-padT-padB;
    let allVals = [];
    data.forEach(d => CHART_ITEMS.forEach(t => allVals.push(unit==='tl' ? d.perTicker[t].pnlTl : d.perTicker[t].pnlPct)));
    let maxV = Math.max(0, ...allVals), minV = Math.min(0, ...allVals);
    const pad = Math.max((maxV-minV)*0.18, Math.max(Math.abs(maxV),Math.abs(minV))*0.12, unit==='tl'?200:1);
    maxV += pad; minV -= pad;
    const yFor = (v) => padT + plotH - ((v-minV)/((maxV-minV)||1))*plotH;
    const zeroY = yFor(0);
    const groupSlot = plotW/data.length;
    const barW = Math.min(8, groupSlot/CHART_ITEMS.length*0.75);

    let bars = '';
    let labels = '';
    data.forEach((d, gi) => {
      const groupX = padL + groupSlot*gi;
      CHART_ITEMS.forEach((t, ti) => {
        const v = unit==='tl' ? d.perTicker[t].pnlTl : d.perTicker[t].pnlPct;
        const x = groupX + (groupSlot - barW*CHART_ITEMS.length)/2 + ti*barW;
        const y = Math.min(zeroY, yFor(v));
        const barH = Math.max(1, Math.abs(yFor(v)-zeroY));
        bars += `<rect class="monthly-bar" data-month="${d.month}" data-ticker="${t}" data-tl="${d.perTicker[t].pnlTl}" data-pct="${d.perTicker[t].pnlPct}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(barW-1).toFixed(1)}" height="${barH.toFixed(1)}" fill="${colorFor(t)}" rx="1.5" style="cursor:pointer;"/>`;
      });
      labels += `<text x="${(groupX+groupSlot/2).toFixed(1)}" y="${h-padB+16}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#8CA0BC">${monthLabel(d.month)}</text>`;
    });

    const legend = CHART_ITEMS.map(t => `
      <div style="display:flex;align-items:center;gap:5px;">
        <span style="width:9px;height:9px;background:${colorFor(t)};display:inline-block;border-radius:2px;"></span>
        <span class="muted" style="font-size:10.5px;">${t==='PPF'?'PPF (Nakit)':t}</span>
      </div>
    `).join('');

    return `
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">${legend}</div>
      <div class="chart-wrap" id="monthly-chart-wrap">
        <svg width="100%" viewBox="0 0 ${w} ${h}" style="max-width:100%;">
          <line x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}" stroke="#294869" stroke-width="1"/>
          <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="#294869" stroke-width="1"/>
          <text x="${padL-6}" y="${zeroY}" text-anchor="end" dominant-baseline="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#8CA0BC">0</text>
          ${bars}
          ${labels}
        </svg>
        <div class="chart-tooltip" id="monthly-chart-tooltip"></div>
      </div>
    `;
  }

  function wireMonthlyChartTooltips(){
    const wrap = document.getElementById('monthly-chart-wrap');
    const tip = document.getElementById('monthly-chart-tooltip');
    if(!wrap || !tip) return;
    const showTip = (el, clientX, clientY) => {
      const rect = wrap.getBoundingClientRect();
      const month = el.getAttribute('data-month');
      const ticker = el.getAttribute('data-ticker');
      const tl = parseFloat(el.getAttribute('data-tl'));
      const pct = parseFloat(el.getAttribute('data-pct'));
      tip.innerHTML = `
        <span class="tt-date">${monthLabel(month)}${ticker?(' · '+(ticker==='PPF'?'PPF (Nakit)':ticker)):''}</span>
        <div class="tt-row"><span>K/Z ₺</span><span style="color:${tl>=0?'#4FCB98':'#E0684F'};">&nbsp;&nbsp;${tl>=0?'+':''}${fmt(tl)}</span></div>
        <div class="tt-row"><span>K/Z %</span><span style="color:${pct>=0?'#4FCB98':'#E0684F'};">&nbsp;&nbsp;${pct>=0?'+':''}${pct.toFixed(2)}%</span></div>
      `;
      tip.style.left = (clientX - rect.left) + 'px';
      tip.style.top = (clientY - rect.top) + 'px';
      tip.classList.add('visible');
    };
    wrap.querySelectorAll('.monthly-bar').forEach(el => {
      el.addEventListener('mouseenter', (e) => showTip(el, e.clientX, e.clientY));
      el.addEventListener('mousemove', (e) => showTip(el, e.clientX, e.clientY));
      el.addEventListener('mouseleave', () => tip.classList.remove('visible'));
      el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.touches[0];
        showTip(el, t.clientX, t.clientY);
        setTimeout(() => tip.classList.remove('visible'), 2200);
      }, {passive:false});
    });
  }

  function renderStatChart(series){
    const w = 640, h = 220, padL=64, padR=15, padT=20, padB=28;
    const plotW = w-padL-padR, plotH = h-padT-padB;
    const pnlVals = series.map(s=>s.pnl);
    let maxV = Math.max(0, ...pnlVals);
    let minV = Math.min(0, ...pnlVals);
    const pad = Math.max((maxV-minV)*0.18, Math.max(Math.abs(maxV),Math.abs(minV))*0.1, 500);
    maxV += pad;
    minV -= pad;
    const xFor = (i) => padL + (series.length===1 ? plotW/2 : i/(series.length-1)*plotW);
    const yForVal = (v) => padT + plotH - ((v-minV)/((maxV-minV)||1))*plotH;

    const zeroY = yForVal(0);
    const zeroPath = `M ${padL} ${zeroY.toFixed(1)} L ${(w-padR).toFixed(1)} ${zeroY.toFixed(1)}`;

    const pnlColor = series[series.length-1].pnl >= 0 ? '#4FCB98' : '#E0684F';
    let pnlPath = series.map((pt,i) => `${i===0?'M':'L'} ${xFor(i).toFixed(1)} ${yForVal(pt.pnl).toFixed(1)}`).join(' ');
    let pnlDots = series.map((pt,i) => `<circle class="pnl-dot" cx="${xFor(i).toFixed(1)}" cy="${yForVal(pt.pnl).toFixed(1)}" r="5" fill="${pt.pnl>=0?'#4FCB98':'#E0684F'}" stroke="#0A1628" stroke-width="1.2" data-date="${pt.date}" data-invested="${pt.invested}" data-pnl="${pt.pnl}"/>`).join('');

    return `
      <div class="chart-wrap" id="stat-chart-wrap">
        <svg width="100%" viewBox="0 0 ${w} ${h}" style="max-width:100%;">
          <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="#294869" stroke-width="1"/>
          <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="#294869" stroke-width="1"/>
          <path d="${zeroPath}" fill="none" stroke="#7FA3C9" stroke-width="1.5" stroke-dasharray="5 4"/>
          <text x="${padL-6}" y="${zeroY.toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#7FA3C9">0</text>
          <path d="${pnlPath}" fill="none" stroke="${pnlColor}" stroke-width="2.2"/>
          ${pnlDots}
        </svg>
        <div class="chart-tooltip" id="stat-chart-tooltip"></div>
      </div>
    `;
  }

  function wireChartTooltips(wrapId, tipId){
    wrapId = wrapId || 'stat-chart-wrap';
    tipId = tipId || 'stat-chart-tooltip';
    const wrap = document.getElementById(wrapId);
    const tip = document.getElementById(tipId);
    if(!wrap || !tip) return;
    const showTip = (dot, clientX, clientY) => {
      const rect = wrap.getBoundingClientRect();
      const date = dot.getAttribute('data-date');
      const invested = parseFloat(dot.getAttribute('data-invested'));
      const pnl = parseFloat(dot.getAttribute('data-pnl'));
      const pct = invested ? (pnl/invested*100) : 0;
      tip.innerHTML = `
        <span class="tt-date">${date}</span>
        <div class="tt-row"><span>Yatırılan</span><span>&nbsp;&nbsp;${fmt(invested)}</span></div>
        <div class="tt-row"><span>Kâr/Zarar</span><span style="color:${pnl>=0?'#4FCB98':'#E0684F'};">&nbsp;&nbsp;${pnl>=0?'+':''}${fmt(pnl)}</span></div>
        <div class="tt-row"><span>K/Z %</span><span style="color:${pnl>=0?'#4FCB98':'#E0684F'};">&nbsp;&nbsp;${pnl>=0?'+':''}${pct.toFixed(2)}%</span></div>
      `;
      tip.style.left = (clientX - rect.left) + 'px';
      tip.style.top = (clientY - rect.top) + 'px';
      tip.classList.add('visible');
    };
    wrap.querySelectorAll('.pnl-dot').forEach(dot => {
      dot.style.cursor = 'pointer';
      dot.addEventListener('mouseenter', (e) => showTip(dot, e.clientX, e.clientY));
      dot.addEventListener('mousemove', (e) => showTip(dot, e.clientX, e.clientY));
      dot.addEventListener('mouseleave', () => tip.classList.remove('visible'));
      dot.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.touches[0];
        showTip(dot, t.clientX, t.clientY);
        setTimeout(() => tip.classList.remove('visible'), 2200);
      }, {passive:false});
    });
  }

  function render(){
    if(activeTab === 'panel') renderPanel();
    if(activeTab === 'gunluk') renderGunluk();
    if(activeTab === 'hafta') renderHafta();
    if(activeTab === 'istatistik') renderIstatistik();
    if(activeTab === 'gecmis') renderGecmis();
    if(activeTab === 'kurulum') renderKurulum();
    if(activeTab === 'yukleme-hatasi') renderYuklemeHatasi();
    if(activeTab !== 'yukleme-hatasi') drawGauge();
  }

  function renderYuklemeHatasi(){
    const el = document.getElementById('yukleme-hatasi-content');
    el.innerHTML = `
      <div class="card" style="border-color:var(--loss);">
        <h2 class="section-title">Veri Yüklenemedi</h2>
        <p class="muted" style="margin-bottom:16px;">Kayıtlı portföy verinize ulaşılamadı. Bu genelde geçici bir bağlantı sorunudur (özellikle mobil ağlarda) — <b>portföyünüz büyük ihtimalle kaybolmadı.</b> Önce tekrar deneyin.</p>
        <p class="mono" style="font-size:10.5px;color:var(--ink-soft);background:var(--bg-2);padding:8px 10px;border-radius:6px;word-break:break-all;">Teknik detay: ${window.__rotasyonLoadErrorDetail || '—'}</p>
        <button class="btn" id="retry-load-btn">Tekrar Dene</button>
        <div id="retry-status" style="margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;"></div>
        <div class="note-box" style="margin-top:20px;">
          Birkaç kez denediniz ve hâlâ ulaşamıyorsanız, ve bu gerçekten <b>ilk kez</b> kullandığınız bir cihaz/oturumsa, aşağıdan yeni bir portföy kurabilirsiniz. <b>Dikkat:</b> eğer mevcut bir portföyünüz varsa ve bu sadece bağlantı sorunuysa, yeni kurulum yapmak eski verinizin üzerine yazmaz (ayrı bir kayıt değildir, aynı slot kullanılır) — bu yüzden emin değilseniz önce başka bir cihazdan/tarayıcıdan kontrol edin.
        </div>
        <button class="btn ghost" id="force-kurulum-btn" style="margin-top:10px;">Yine de Yeni Kurulum Ekranına Git</button>
      </div>
    `;
    document.getElementById('retry-load-btn').onclick = async () => {
      const statusEl = document.getElementById('retry-status');
      statusEl.textContent = 'Deneniyor...';
      await loadState();
      if(!window.__rotasyonLoadError && state && state.initialized){
        statusEl.style.color = 'var(--gain)';
        statusEl.textContent = '✓ Bağlantı kuruldu, portföyünüz bulundu.';
        setTimeout(() => setTab('panel'), 700);
      } else if(!window.__rotasyonLoadError && !(state && state.initialized)){
        statusEl.style.color = 'var(--ink-soft)';
        statusEl.textContent = 'Bağlantı kuruldu ama kayıtlı bir portföy bulunamadı (muhtemelen gerçekten ilk kullanım).';
      } else {
        statusEl.style.color = 'var(--loss)';
        statusEl.textContent = '✕ Hâlâ ulaşılamıyor: ' + (window.__rotasyonLoadErrorDetail || 'bilinmeyen hata');
      }
    };
    document.getElementById('force-kurulum-btn').onclick = () => setTab('kurulum');
  }

  document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if(btn) setTab(btn.dataset.tab);
  });

  (async function init(){
    await loadState();
    if(window.__rotasyonLoadError && !(state && state.initialized)){
      setTab('yukleme-hatasi');
    } else {
      setTab(state && state.initialized ? 'panel' : 'kurulum');
    }
  })();
})();
</script>
